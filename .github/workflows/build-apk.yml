
name: Build Krishna Jewellers Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 6. Make Gradle wrapper executable
      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      # 7. Build Android Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 8. Run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 9. Upload generated APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KrishnaJewellersApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
